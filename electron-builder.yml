# PallettAI Studio — desktop packaging
# Distribution model: direct download from pallettai.org / GitHub Releases
# (Developer ID signing + notarization — NOT the Mac App Store).
appId: ai.pallettai.studio
productName: PallettAI Studio
copyright: Made by PallettAI

directories:
  buildResources: build
  output: dist

# Only ship what the studio needs at runtime.
files:
  - index.html
  - app.js
  - styles.css
  - main.js
  - preload.js
  - data/**
  - modules/**
  - '!**/*.map'
  - '!**/*.md'

asar: true
npmRebuild: false

# Electron Fuses — flip security-critical fuses in the packaged Electron binary.
# electron-builder flips these BEFORE codesigning (macOS) so the signature stays valid.
# All options come from @electron/fuses (FuseOptionsV1).
# Ref: https://github.com/electron/fuses
# Ref: https://raw.githubusercontent.com/electron/electron/refs/heads/main/docs/tutorial/fuses.md
electronFuses:
  # Disables ELECTRON_RUN_AS_NODE — stops "turn the app into Node" attack chains.
  # PallettAI does not use process.fork in the main process, so this is safe.
  runAsNode: false
  # Encrypt Chromium's cookie store on disk via OS-level crypto (Keychain/DPAPI).
  # One-way transition: existing plaintext cookies are encrypted on write; no data loss.
  # PallettAI does not use browser cookies (localStorage only), so this is pure defense-in-depth.
  enableCookieEncryption: true
  # Disables NODE_OPTIONS / NODE_EXTRA_CA_CERTS env vars — stops injecting runtime flags.
  enableNodeOptionsEnvironmentVariable: false
  # Disables --inspect / --inspect-brk / SIGUSR1 main-process inspector.
  # Stops remote debugging of a shipped build. Devs can still use the in-app dev tools
  # in development builds (View → Reload / toggleDevTools) which do not need this fuse.
  enableNodeCliInspectArguments: false
  # Validate app.asar integrity on load (macOS >=16, Windows >=30 — Electron 44 supports both).
  # Combined with onlyLoadAppFromAsar below, makes it impossible to load non-validated code.
  enableEmbeddedAsarIntegrityValidation: true
  # Only load the app from app.asar (no fallback to loose app/ directory).
  # Combined with enableEmbeddedAsarIntegrityValidation = tamper-proof app code.
  # PallettAI ships everything it needs inside the asar (no native modules, no external files).
  onlyLoadAppFromAsar: true
  # Browser process uses its own V8 snapshot (browser_v8_context_snapshot.bin) — small perf win.
  loadBrowserProcessSpecificV8Snapshot: true
  # Disable extra privileges for file:// protocol pages (fetch, service workers, child-frame access).
  # PallettAI's renderer does not fetch over file://, register service workers, or use file:// iframes,
  # so this is safe and removes an unnecessary privilege surface.
  grantFileProtocolExtraPrivileges: false

mac:
  category: public.app-category.graphics-design
  artifactName: PallettAI-Studio-${version}-mac-${arch}.${ext}
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is driven by env vars at build time:
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # Signing identity is auto-discovered from the keychain, or supplied via
  #   CSC_LINK (base64 p12) + CSC_KEY_PASSWORD.
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

# Windows (NSIS installer) — signed via CSC_LINK + CSC_KEY_PASSWORD at build
# time. electron-updater reads latest.yml on Windows (latest-mac.yml on macOS).
win:
  artifactName: PallettAI-Studio-${version}-win-${arch}.${ext}
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: PallettAI-Studio-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PallettAI Studio
  deleteAppDataOnUninstall: false

dmg:
  title: PallettAI Studio ${version}
  icon: build/icon.png
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications

# Auto-update (electron-updater) reads latest-mac.yml from the same GitHub
# release. Override owner/repo in package.json "repository" if it changes.
publish:
  - provider: github
    owner: PallettAi
    repo: pallettai-website
