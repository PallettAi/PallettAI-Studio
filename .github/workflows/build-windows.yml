name: Build and publish PallettAI Studio for Windows

# Tag-triggered Windows releases are deliberately disabled for now.
#
# Both workflows read the same CSC_LINK secret, but macOS needs an Apple .p12
# while Windows needs a .pfx — a single secret cannot be both. So a `v*` tag
# also fired this workflow, which then failed its own credential guard and left
# a red X on every release. Run it manually from the Actions tab instead: a
# manual run uploads artifacts and does not publish a release.
#
# Re-add a `push: { tags: ['v*'] }` trigger once there is a Windows code-
# signing certificate. Give Windows its own secret (e.g. WIN_CSC_LINK) rather
# than sharing CSC_LINK, so tagging cannot sign a build with the wrong cert.
on:
  workflow_dispatch:

# The Studio source can live in its own repository. Releases are published to
# the public website repository so pallettai.org/downloads has stable links.
env:
  RELEASE_REPOSITORY: PallettAi/pallettai-website

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags. This workflow hands
      # RELEASE_TOKEN (write access to the public website repo — which is also
      # the electron-updater feed) to a third-party action, so a moved or
      # compromised tag would be enough to publish a malicious auto-update to
      # every installed app. Update by bumping the SHA + version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag $tag_version does not match package.json version $package_version"
            exit 1
          }

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret: $name"
              exit 1
            fi
          done

      - name: Build & sign Windows installer (NSIS x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win -- --publish never

      # This step used to be decorative, and that is worth spelling out because it
      # looked like a passing check on every green build. It looked for
      # `*-win32-x64.zip` and a "PallettAI Studio.app" bundle INSIDE it — both
      # macOS shapes — and every failure path was a `::warning::` followed by
      # `exit 0`. The win target here is NSIS only (no zip is emitted), so it took
      # the first branch on every run and Windows fuses were never verified at
      # all. It now inspects the packaged app that electron-builder actually
      # produces, and a missing artifact is an ERROR rather than a shrug: a guard
      # that cannot fail is worse than no guard, because it buys false assurance.
      - name: Verify Electron Fuses (Windows)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          # NSIS is built from this unpacked app directory, so it always exists
          # after the build and is the real payload the installer wraps.
          app_exe="dist/win-unpacked/PallettAI Studio.exe"
          if [ ! -f "$app_exe" ]; then
            echo "::error::No packaged app at $app_exe — electron-builder did not produce win-unpacked, so the fuses in the shipped installer are UNVERIFIED."
            ls -la dist/ || true
            exit 1
          fi

          echo "Verifying fuses in: $app_exe"

          read_out="$(npx --no-install electron-fuses read --app "$app_exe" 2>&1)" || {
            echo "::error::electron-fuses could not read $app_exe — fuses are UNVERIFIED."
            echo "$read_out"
            exit 1
          }
          echo "$read_out"
          # NOTE: the expected-fuse table below is the assertion. It mirrors the
          # macOS step — one electronFuses block in electron-builder.yml feeds
          # both platforms, so a drift here means the config changed under one of
          # them.
          declare -A expected=(
            [RunAsNode]="Disabled"
            [EnableCookieEncryption]="Enabled"
            [EnableNodeOptionsEnvironmentVariable]="Disabled"
            [EnableNodeCliInspectArguments]="Disabled"
            [EnableEmbeddedAsarIntegrityValidation]="Enabled"
            [OnlyLoadAppFromAsar]="Enabled"
            [LoadBrowserProcessSpecificV8Snapshot]="Disabled"
            [GrantFileProtocolExtraPrivileges]="Enabled"
          )

          failed=0
          for fuse in "${!expected[@]}"; do
            want="${expected[$fuse]}"
            if echo "$read_out" | grep -qF "$fuse is $want"; then
              echo "  ✓ $fuse is $want"
            else
              echo "::error::Fuse $fuse is NOT $want (verify electron-builder.yml electronFuses block)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::${failed} fuse(s) not set as configured — packaged build may be insecure"
            exit 1
          fi

          echo "All configured Electron Fuses verified in the packaged build."

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "dist/PallettAI-Studio-${version}-setup.exe"
          test -f dist/latest.yml
          grep -Fq "url: PallettAI-Studio-${version}-setup.exe" dist/latest.yml || {
            echo "latest.yml does not reference built asset PallettAI-Studio-${version}-setup.exe"
            exit 1
          }
          echo "Built PallettAI Studio ${version} for Windows; updater manifest matches the artifact"

      - name: Create stable download alias
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cp "dist/PallettAI-Studio-${version}-setup.exe" dist/PallettAI-Studio-setup.exe

      - name: Attach assets to the website release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # RELEASE_TOKEN must be a fine-grained PAT scoped to
          # contents:write on RELEASE_REPOSITORY only — no other scopes, no
          # access to this repo. Prefer a short expiry + rotation, or a GitHub
          # App installation token. See docs/SECURITY-HARDENING.md.
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml

      - name: Upload unsigned/manual artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PallettAI-Studio-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error