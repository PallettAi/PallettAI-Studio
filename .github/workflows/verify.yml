name: Verify

# The release gate has always run on one person's machine and nowhere else.
# That is how a one-line defect broke the generator, passed all 135 suites,
# shipped in 0.4.14, and was found by a user. This workflow runs the same gate
# on every push, so a tag cannot be cut against a red build.

# One `on:` block only. A second `push:` key would silently replace the first
# rather than merging with it, which is how the first version of this file
# ended up matching no branches at all and failed in 0 seconds.
on:
  push:
    branches: [main]
    # A tag is the moment a build becomes public, so the gate runs again at the
    # exact commit being published rather than trusting an earlier run.
    tags: ['v*']
  pull_request:
    branches: [main]

# Never let two runs write the same cache key, and never let a superseded run
# cancel the verification of a commit that is still the tip.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron downloads its binary in a postinstall script. npm skips that
      # whenever it is told not to run scripts — and CI images sometimes set
      # that — so the smoke would find no binary and fail for a reason that has
      # nothing to do with the app. Make the binary explicit and verifiable.
      - name: Ensure the Electron binary is present
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "Electron's postinstall did not run; installing its binary now."
            node node_modules/electron/install.js
          fi
          BIN="node_modules/electron/dist/$(cat node_modules/electron/path.txt)"
          if [ ! -x "$BIN" ]; then
            echo "::error::Electron binary is still missing at $BIN"
            exit 1
          fi
          echo "Electron binary: $BIN"

      # The real-app smoke launches Electron, which needs a display server.
      # This is the step that distinguishes CI from the developer's Mac:
      # headless, software-rendered, and nobody watching.
      #
      # The library list is installed one package at a time because Ubuntu
      # renames these between releases — libasound2 became libasound2t64 on
      # 24.04, and a single apt-get line naming the old one fails the whole
      # step. Each is optional: the smoke reports a real launch error if one
      # is genuinely required, which is more useful than a package-name
      # mismatch masquerading as an app fault.
      - name: Install the virtual display and Electron's shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          for pkg in libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libasound2t64 libxss1 libxtst6; do
            sudo apt-get install -y "$pkg" || echo "optional: $pkg not available on this image"
          done

      - name: Release gate
        run: xvfb-run --auto-servernum npm run release:check

      # A suite that passes because it silently tested nothing is worse than no
      # suite at all — it manufactures false confidence. The real-app smoke
      # writes a receipt; a missing or empty one means the gate skipped the
      # only check that runs the real application.
      - name: The real-app smoke must have actually run
        run: |
          if [ ! -f .app-smoke-receipt.json ]; then
            echo "::error::app-smoke left no receipt — the gate skipped the only check that runs the real app"
            exit 1
          fi
          cat .app-smoke-receipt.json
          node -e "
            const r = require('./.app-smoke-receipt.json');
            if (!r.ran) { console.error('::error::app-smoke did not run'); process.exit(1); }
            if (!(r.passed > 0)) { console.error('::error::app-smoke made no checks'); process.exit(1); }
            if (r.creditsRefunded) { console.error('::error::a successful generation refunded the credit'); process.exit(1); }
            if (!(r.previewBytes > 500)) { console.error('::error::the preview rendered nothing'); process.exit(1); }
            console.log('verified: ' + r.passed + ' real-app checks, site rendered ' + r.previewBytes + ' bytes');
          "
