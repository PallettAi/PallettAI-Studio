name: Build and publish PallettAI Studio for macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# The Studio source can live in its own repository. Releases are published to
# the public website repository so pallettai.org/downloads has stable links.
env:
  RELEASE_REPOSITORY: PallettAi/pallettai-website

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    steps:
      # Actions are pinned to commit SHAs, not moving tags. This workflow hands
      # RELEASE_TOKEN (write access to the public website repo — which is also
      # the electron-updater feed) to a third-party action, so a moved or
      # compromised tag would be enough to publish a malicious auto-update to
      # every installed app. Update by bumping the SHA + version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag $tag_version does not match package.json version $package_version"
            exit 1
          }

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Code signing is required even without an Apple Developer account.
          # Squirrel.Mac refuses to install an update whose code signature does
          # not match the installed app, so an unsigned build can never ship an
          # auto-update. A self-signed certificate satisfies that, provided the
          # runner trusts it — see the trust step below, which is not optional.
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          # Notarization is optional and needs a paid Apple Developer account.
          # electron-builder skips it on its own when none of these are set
          # (MacTargetHelper.getNotarizeOptions returns undefined), so simply
          # not configuring them is the supported way to ship a signed-but-
          # not-notarized build. That build still updates itself: auto-update
          # only compares code signatures, which is why CSC_LINK is required.
          #
          # It is all-or-nothing, though — a partial set makes electron-builder
          # throw halfway through the build, so fail early and clearly instead.
          apple_set=0
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name:-}" ]; then
              apple_set=$((apple_set + 1))
            fi
          done
          if [ "$apple_set" -ne 0 ] && [ "$apple_set" -ne 3 ]; then
            echo "::error::Notarization credentials are all-or-nothing — set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID together, or leave all three unset."
            exit 1
          fi
          if [ "$apple_set" -eq 0 ]; then
            echo "::warning title=Release will not be notarized::No Apple credentials configured. The build will be signed but not notarized, so first launch of a downloaded DMG shows a Gatekeeper prompt."
          fi

      # electron-builder signs with a non-Apple certificate only if the machine
      # already trusts it. A developer Mac was given that trust once by hand
      # (`security add-trusted-cert`); a fresh runner has never seen the
      # certificate, so macOS marks every identity it holds as invalid and
      # electron-builder SILENTLY SKIPS signing instead of failing:
      #
      #   • skipped macOS application code signing
      #     allIdentities= 1) "PallettAI Studio (Self-Signed)" (CSSMERR_TP_NOT_TRUSTED)
      #
      # An unsigned build installs fine and then can never auto-update, so the
      # failure is invisible until users are stuck on an old version. Trusting
      # the leaf here is what makes CI match a developer machine; it affects
      # only this disposable runner, and CA-issued certificates are left alone.
      - name: Make the runner trust the signing certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No CSC_LINK configured; nothing to trust."
            exit 0
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # Decode the way electron-builder does, so wrapped base64 is fine too.
          CSC_LINK="$CSC_LINK" node -e \
            'process.stdout.write(Buffer.from(process.env.CSC_LINK, "base64"))' > "$work/signing.p12"
          printf '%s' "$CSC_KEY_PASSWORD" > "$work/password"
          openssl pkcs12 -in "$work/signing.p12" -nokeys -clcerts \
            -passin file:"$work/password" -out "$work/signing.pem"

          subject="$(openssl x509 -in "$work/signing.pem" -noout -subject | sed 's/^subject= *//')"
          issuer="$(openssl x509 -in "$work/signing.pem" -noout -issuer | sed 's/^issuer= *//')"
          if [ -z "$subject" ]; then
            echo "::error::Could not read a certificate out of CSC_LINK — is the secret the base64 of a .p12 that includes its private key?"
            exit 1
          fi

          if [ "$subject" = "$issuer" ]; then
            echo "Self-signed certificate — trusting it for this runner."
            sudo security add-trusted-cert -d -p codeSign -r trustRoot \
              -k /Library/Keychains/System.keychain "$work/signing.pem"
          else
            echo "Certificate is CA-issued ($subject); the system trust store already covers it."
          fi

          # Ask the exact question the build will ask, against the exact
          # command electron-builder uses, so a trust problem costs seconds
          # instead of a ten-minute build that produces an unusable release.
          probe="$work/probe.keychain"
          probe_password="probe"
          security create-keychain -p "$probe_password" "$probe"
          security unlock-keychain -p "$probe_password" "$probe"
          # Mirror electron-builder's import exactly, partition list included,
          # so this probe cannot pass where the real signing step would fail.
          security import "$work/signing.p12" -k "$probe" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -P "$CSC_KEY_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$probe_password" "$probe" >/dev/null

          found="$(security find-identity -v -p codesigning "$probe" 2>&1 || true)"
          security delete-keychain "$probe" >/dev/null 2>&1 || true
          printf '%s\n' "$found"

          # Assert positively on an identity entry, not on the absence of a
          # "0 valid" line — "10 valid identities found" contains that too.
          if printf '%s' "$found" | grep -qE '^[[:space:]]*[0-9]+\)[[:space:]]'; then
            echo "Runner can sign with this certificate."
          else
            echo "::error::This runner cannot use the CSC_LINK certificate for code signing, so electron-builder would skip signing and the release could never auto-update."
            exit 1
          fi

      # Also notarizes, but only when the APPLE_* secrets above are present.
      - name: Build & sign macOS artifacts (arm64 + x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish never

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "dist/PallettAI-Studio-${version}-mac-arm64.dmg"
          test -f "dist/PallettAI-Studio-${version}-mac-x64.dmg"
          test -f "dist/PallettAI-Studio-${version}-mac-arm64.zip"
          test -f "dist/PallettAI-Studio-${version}-mac-x64.zip"
          test -f dist/latest-mac.yml
          for asset in \
            "PallettAI-Studio-${version}-mac-arm64.zip" \
            "PallettAI-Studio-${version}-mac-x64.zip" \
            "PallettAI-Studio-${version}-mac-arm64.dmg" \
            "PallettAI-Studio-${version}-mac-x64.dmg"; do
            grep -Fq "url: $asset" dist/latest-mac.yml || {
              echo "latest-mac.yml does not reference built asset $asset"
              exit 1
            }
          done
          echo "Built PallettAI Studio ${version} for arm64 and x64; updater manifest matches artifacts"

      # The guard that was missing. electron-builder treats an unusable signing
      # identity as a warning, not an error, so a broken trust setup produces a
      # green build with an unsigned app inside it. Check the artifact itself.
      - name: Verify the build is really code-signed
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app_name="PallettAI Studio.app"

          zip="dist/PallettAI-Studio-${version}-mac-arm64.zip"
          if [ ! -f "$zip" ]; then
            zip="dist/PallettAI-Studio-${version}-mac-x64.zip"
          fi
          if [ ! -f "$zip" ]; then
            echo "::error::No macOS build zip found to check"
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -q -o "$zip" -d "$tmpdir"
          app="$(find "$tmpdir" -name "$app_name" -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::Could not find $app_name inside $(basename "$zip")"
            exit 1
          fi

          info="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
          printf '%s\n' "$info"

          # An unsigned or ad-hoc-signed bundle has no Authority line at all.
          authority="$(printf '%s\n' "$info" | sed -n 's/^Authority=//p' | head -n 1)"
          if [ -z "$authority" ]; then
            echo "::error::The build is NOT code-signed. Squirrel.Mac will refuse to auto-update it, so this release must not be published."
            exit 1
          fi

          codesign --verify --deep --strict "$app" || {
            echo "::error::codesign verification failed — a signature is present but it is not valid"
            exit 1
          }

          echo "Signed by: $authority"

      - name: Verify Electron Fuses (macOS)
        if: runner.os != 'macOS' || true
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          # Find the .app inside the built .zip (handles arm64 vs x64 zip name).
          app_zip="dist/PallettAI-Studio-${version}-mac-arm64.zip"
          if [ ! -f "$app_zip" ]; then
            app_zip="dist/PallettAI-Studio-${version}-mac-x64.zip"
          fi
          if [ ! -f "$app_zip" ]; then
            echo "::error::No macOS build zip found (arm64 nor x64)"
            exit 1
          fi

          app_name="PallettAI Studio.app"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          unzip -q -o "$app_zip" -d "$tmpdir"
          extracted_app="$(find "$tmpdir" -name "$app_name" -type d | head -n 1)"
          if [ -z "$extracted_app" ]; then
            echo "::error::Could not find $app_name inside the built zip"
            exit 1
          fi

          echo "Verifying fuses in: $extracted_app"

          # electron-fuses read prints one line per fuse, e.g.
          #   "  RunAsNode is Disabled"
          #   "  EnableCookieEncryption is Enabled"
          #   ... (plus a cosmetic "  undefined is Enabled" for any unset key)
          read_out="$(npx --no-install electron-fuses read --app "$extracted_app" 2>&1)" || {
            echo "::error::electron-fuses read failed"
            echo "$read_out"
            exit 1
          }
          echo "$read_out"

          # The 8 fuses we configured in electron-builder.yml (electronFuses block).
          # Each must appear as "<Label> is <Enabled/Disabled>" in the read output.
          declare -A expected=(
            [RunAsNode]="Disabled"
            [EnableCookieEncryption]="Enabled"
            [EnableNodeOptionsEnvironmentVariable]="Disabled"
            [EnableNodeCliInspectArguments]="Disabled"
            [EnableEmbeddedAsarIntegrityValidation]="Enabled"
            [OnlyLoadAppFromAsar]="Enabled"
            [LoadBrowserProcessSpecificV8Snapshot]="Disabled"
            [GrantFileProtocolExtraPrivileges]="Enabled"
          )

          failed=0
          for fuse in "${!expected[@]}"; do
            want="${expected[$fuse]}"
            if echo "$read_out" | grep -qF "$fuse is $want"; then
              echo "  ✓ $fuse is $want"
            else
              echo "::error::Fuse $fuse is NOT $want (verify electron-builder.yml electronFuses block)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::${failed} fuse(s) not set as configured — packaged build may be insecure"
            exit 1
          fi

          echo "All configured Electron Fuses verified in the packaged build."

      - name: Create stable download aliases
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cp "dist/PallettAI-Studio-${version}-mac-arm64.dmg" dist/PallettAI-Studio-mac-arm64.dmg
          cp "dist/PallettAI-Studio-${version}-mac-x64.dmg" dist/PallettAI-Studio-mac-x64.dmg

      - name: Attach assets to the website release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # RELEASE_TOKEN must be a fine-grained PAT scoped to
          # contents:write on RELEASE_REPOSITORY only — no other scopes, no
          # access to this repo. Prefer a short expiry + rotation, or a GitHub
          # App installation token. See docs/SECURITY-HARDENING.md.
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

      - name: Upload unsigned/manual artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PallettAI-Studio-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
